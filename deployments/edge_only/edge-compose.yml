services:
  edge-mqtt:
    build:
      context: ../../mqtt
    container_name: edge-only-mqtt
    ports:
      - "${EDGE_MQTT_BIND_ADDRESS:-0.0.0.0}:1883:1883"
    volumes:
      - edge_mqtt_data:/mosquitto/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -r -m ok && mosquitto_sub -h 127.0.0.1 -p 1883 -t healthcheck -C 1 -W 2 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sensor-generator:
    build:
      context: ../..
      dockerfile: services/sensor-generator/Dockerfile
    container_name: sensor-generator
    depends_on:
      edge-mqtt:
        condition: service_healthy
    volumes:
      - ../../datasets:/app/datasets:ro
    environment:
      MQTT_HOST: edge-mqtt
      MQTT_PORT: 1883
      STREAM_INTERVAL: ${STREAM_INTERVAL:-0.1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3

  detector:
    build:
      context: ../..
      dockerfile: services/detector/Dockerfile
    container_name: detector
    depends_on:
      edge-mqtt:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    environment:
      MQTT_HOST: edge-mqtt
      MQTT_PORT: 1883
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3

  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    container_name: orchestrator
    depends_on:
      edge-mqtt:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m
    environment:
      MQTT_HOST: edge-mqtt
      MQTT_PORT: 1883
      EVAL_WINDOW_SECONDS: ${EVAL_WINDOW_SECONDS:-10}
      ANOMALY_HIGH_RATIO: ${ANOMALY_HIGH_RATIO:-0.5}
      ANOMALY_LOW_RATIO: ${ANOMALY_LOW_RATIO:-0.1}
      FALLBACK_STREAM_INTERVAL: ${FALLBACK_STREAM_INTERVAL:-0.1}
      DIAGNOSIS_ENDPOINT: http://classifier:8000/diagnose
      DIAGNOSIS_TIMEOUT: ${DIAGNOSIS_TIMEOUT:-5.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3

  classifier:
    build:
      context: ../..
      dockerfile: services/classifier/Dockerfile
    container_name: classifier
    depends_on:
      edge-mqtt:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1g
    environment:
      MQTT_HOST: edge-mqtt
      MQTT_PORT: 1883
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  edge_mqtt_data:
