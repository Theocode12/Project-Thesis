AWSTemplateFormatVersion: '2010-09-09'
Description: Cloud-only deployment with separate dashboard, processing, and source instances.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  DashboardInstanceType:
    Type: String
    Default: t3.small
  ProcessingInstanceType:
    Type: String
    Default: t3.large
  SourceInstanceType:
    Type: String
    Default: t3.small
  KeyName:
    Type: String
    Default: ''
  AdminCidr:
    Type: String
    Default: 0.0.0.0/0
  RepositoryUrl:
    Type: String
  RepositoryRef:
    Type: String
    Default: main
  Domain:
    Type: String
    Default: cloud-thesis.devval.dev
  CaddyCertificate:
    Type: String
    NoEcho: true
  CaddyPrivateKey:
    Type: String
    NoEcho: true

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: thesis-cloud-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: thesis-cloud-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: thesis-cloud-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: thesis-cloud-public-routes

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  DashboardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS dashboard access.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-cloud-dashboard-sg

  ProcessingSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private cloud processing services.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1883
          ToPort: 1883
          SourceSecurityGroupId: !Ref DashboardSecurityGroup
        - IpProtocol: tcp
          FromPort: 1883
          ToPort: 1883
          SourceSecurityGroupId: !Ref SourceSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-cloud-processing-sg

  SourceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Industrial source simulator access to cloud MQTT.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-cloud-source-sg

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  DashboardInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref DashboardInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref DashboardSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: thesis-cloud-dashboard
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-plugin git
          systemctl enable --now docker
          rm -rf /opt/project/app
          git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
          cd /opt/project/app
          mkdir -p /opt/project/app/certs
          cat > /opt/project/app/certs/origin.pem <<'CERT'
          ${CaddyCertificate}
          CERT
          cat > /opt/project/app/certs/origin.key <<'KEY'
          ${CaddyPrivateKey}
          KEY
          chmod 600 /opt/project/app/certs/origin.key
          chmod 644 /opt/project/app/certs/origin.pem
          cat > /etc/thesis-dashboard.env <<'ENV'
          CLOUD_MQTT_HOST=${ProcessingInstance.PrivateIp}
          CLOUD_MQTT_PORT=1883
          DOMAIN=${Domain}
          ENV
          set -a
          source /etc/thesis-dashboard.env
          set +a
          docker compose -f deploments/cloud_only/dashboard-compose.yml up -d --build

  ProcessingInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref ProcessingInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref ProcessingSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: thesis-cloud-processing
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-plugin git
          systemctl enable --now docker
          rm -rf /opt/project/app
          git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
          cd /opt/project/app
          docker compose -f deploments/cloud_only/cloud-compose.yml up -d --build

  SourceInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref SourceInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref SourceSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: thesis-cloud-source
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-plugin git
          systemctl enable --now docker
          rm -rf /opt/project/app
          git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
          cd /opt/project/app
          CLOUD_MQTT_HOST=${ProcessingInstance.PrivateIp} \
            docker compose -f deploments/cloud_only/source-compose.yml up -d --build

Outputs:
  DashboardPublicIp:
    Value: !GetAtt DashboardInstance.PublicIp
  DashboardPrivateIp:
    Value: !GetAtt DashboardInstance.PrivateIp
  ProcessingPrivateIp:
    Value: !GetAtt ProcessingInstance.PrivateIp
  SourcePrivateIp:
    Value: !GetAtt SourceInstance.PrivateIp
  DashboardSecurityGroupId:
    Value: !Ref DashboardSecurityGroup
  ProcessingSecurityGroupId:
    Value: !Ref ProcessingSecurityGroup
  SourceSecurityGroupId:
    Value: !Ref SourceSecurityGroup
