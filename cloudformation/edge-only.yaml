AWSTemplateFormatVersion: '2010-09-09'
Description: Edge-only deployment with a separate public dashboard instance.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: VPC CIDR; use a range from /16 through /24.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  DashboardInstanceType:
    Type: String
    Default: t3.micro
    Description: Free Tier eligible dashboard instance type.
  EdgeInstanceType:
    Type: String
    Default: t3.small
    Description: Free Tier eligible edge processing instance type.
  KeyName:
    Type: String
    Default: ''
  AdminCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Temporary SSH source range for testing.
  RepositoryUrl:
    Type: String
    Default: https://github.com/Theocode12/Project-Thesis.git
    Description: Git URL accessible by the instances.
  RepositoryRef:
    Type: String
    Default: research
  Domain:
    Type: String
    Default: edge-thesis.devval.dev
  CaddyCertificate:
    Type: String
    NoEcho: true
  CaddyPrivateKey:
    Type: String
    NoEcho: true

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: thesis-edge-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: thesis-edge-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 1, 4]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: thesis-edge-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: thesis-edge-public-routes

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  DashboardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS dashboard access and private MQTT egress.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-edge-dashboard-sg

  EdgeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private edge services.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1883
          ToPort: 1883
          SourceSecurityGroupId: !Ref DashboardSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-edge-processing-sg

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  DashboardInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref DashboardInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref DashboardSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: thesis-edge-dashboard
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/thesis-bootstrap.log) 2>&1
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 5 ]; then return 1; fi
              sleep 10
            done
          }
          wait_for_port() {
            local host="$1" port="$2" attempts=0
            until (echo > "/dev/tcp/$host/$port") 2>/dev/null; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 60 ]; then return 1; fi
              sleep 2
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry apt-get update
          retry apt-get install -y docker.io docker-compose-plugin git
           systemctl enable --now docker
           rm -rf /opt/project/app
          retry git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
           cd /opt/project/app
          mkdir -p /opt/project/app/certs
          cat > /opt/project/app/certs/origin.pem <<'CERT'
          ${CaddyCertificate}
          CERT
          cat > /opt/project/app/certs/origin.key <<'KEY'
          ${CaddyPrivateKey}
          KEY
          chmod 600 /opt/project/app/certs/origin.key
          chmod 644 /opt/project/app/certs/origin.pem
          cat > /etc/thesis-dashboard.env <<'ENV'
          EDGE_MQTT_HOST=${EdgeInstance.PrivateIp}
          EDGE_MQTT_PORT=1883
          DOMAIN=${Domain}
          ENV
           set -a
           source /etc/thesis-dashboard.env
           set +a
          wait_for_port "$EDGE_MQTT_HOST" "$EDGE_MQTT_PORT"
          docker compose -f deploments/edge_only/dashboard-compose.yml config -q
          docker compose -f deploments/edge_only/dashboard-compose.yml up -d --build

  EdgeInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref EdgeInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref EdgeSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: thesis-edge-processing
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/thesis-bootstrap.log) 2>&1
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 5 ]; then return 1; fi
              sleep 10
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry apt-get update
          retry apt-get install -y docker.io docker-compose-plugin git
           systemctl enable --now docker
           rm -rf /opt/project/app
          retry git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
           cd /opt/project/app
          docker compose -f deploments/edge_only/edge-compose.yml config -q
          docker compose -f deploments/edge_only/edge-compose.yml up -d --build

Outputs:
  DashboardInstanceId:
    Value: !Ref DashboardInstance
  DashboardPublicIp:
    Value: !GetAtt DashboardInstance.PublicIp
  DashboardPrivateIp:
    Value: !GetAtt DashboardInstance.PrivateIp
  EdgeInstanceId:
    Value: !Ref EdgeInstance
  EdgePrivateIp:
    Value: !GetAtt EdgeInstance.PrivateIp
  DashboardSecurityGroupId:
    Value: !Ref DashboardSecurityGroup
  EdgeSecurityGroupId:
    Value: !Ref EdgeSecurityGroup
