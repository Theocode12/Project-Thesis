AWSTemplateFormatVersion: '2010-09-09'
Description: Complete hybrid deployment with separate dashboard, edge, and cloud instances.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: VPC CIDR; use a range from /16 through /24.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  DashboardInstanceType:
    Type: String
    Default: t3.micro
    Description: Free Tier eligible dashboard instance type.
  EdgeInstanceType:
    Type: String
    Default: t3.small
    Description: Free Tier eligible edge processing instance type.
  CloudInstanceType:
    Type: String
    Default: m7i-flex.large
    Description: Free Tier eligible cloud processing instance type.
  KeyName:
    Type: String
    Default: ''
  AdminCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Temporary SSH source range for testing.
  RepositoryUrl:
    Type: String
    Default: https://github.com/Theocode12/Project-Thesis.git
    Description: Git URL accessible by all instances.
  RepositoryRef:
    Type: String
    Default: research
  Domain:
    Type: String
    Default: hybrid-thesis.devval.dev
  CaddyCertificate:
    Type: AWS::SSM::Parameter::Value<String>
    Default: Certificate-Pem
    NoEcho: true
  CaddyPrivateKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: Certificate-Key
    NoEcho: true

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: thesis-hybrid-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: thesis-hybrid-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 1, 4]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: thesis-hybrid-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: thesis-hybrid-public-routes

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  DashboardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS dashboard and private MQTT client access.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-hybrid-dashboard-sg

  EdgeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private edge MQTT and orchestration services.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1883
          ToPort: 1883
          SourceSecurityGroupId: !Ref DashboardSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-hybrid-edge-sg

  CloudSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private cloud MQTT and classifier services.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1883
          ToPort: 1883
          SourceSecurityGroupId: !Ref DashboardSecurityGroup
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref EdgeSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-hybrid-cloud-sg

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  DashboardInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref DashboardInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref DashboardSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: thesis-hybrid-dashboard
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/thesis-bootstrap.log) 2>&1
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 5 ]; then return 1; fi
              sleep 10
            done
          }
          wait_for_port() {
            local host="$1" port="$2" attempts=0
            until (echo > "/dev/tcp/$host/$port") 2>/dev/null; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 60 ]; then return 1; fi
              sleep 2
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry apt-get update
          retry apt-get install -y docker.io docker-compose-v2 git openssl
           systemctl enable --now docker
           rm -rf /opt/project/app
          retry git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
          cd /opt/project/app
          mkdir -p /opt/project/app/certs
          mkdir -p /opt/project/app/experiments/hybrid
          printf '%b' '${CaddyCertificate}' > /opt/project/app/certs/origin.pem
          printf '%b' '${CaddyPrivateKey}' > /opt/project/app/certs/origin.key
          chmod 600 /opt/project/app/certs/origin.key
          chmod 644 /opt/project/app/certs/origin.pem
          openssl x509 -in /opt/project/app/certs/origin.pem -noout
          openssl pkey -in /opt/project/app/certs/origin.key -noout
          cat > /etc/thesis-dashboard.env <<'ENV'
          EDGE_MQTT_HOST=${EdgeInstance.PrivateIp}
          EDGE_MQTT_PORT=1883
          CLOUD_MQTT_HOST=${CloudInstance.PrivateIp}
          CLOUD_MQTT_PORT=1883
          DOMAIN=${Domain}
          ENV
          set -a
          source /etc/thesis-dashboard.env
          set +a
          wait_for_port "$EDGE_MQTT_HOST" "$EDGE_MQTT_PORT"
          wait_for_port "$CLOUD_MQTT_HOST" "$CLOUD_MQTT_PORT"
          docker compose --env-file /etc/thesis-dashboard.env -f deployments/hybrid/dashboard-compose.yml config -q
          docker compose --env-file /etc/thesis-dashboard.env -f deployments/hybrid/dashboard-compose.yml up -d --build

  EdgeInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref EdgeInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref EdgeSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: thesis-hybrid-edge
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/thesis-bootstrap.log) 2>&1
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 5 ]; then return 1; fi
              sleep 10
            done
          }
          wait_for_port() {
            local host="$1" port="$2" attempts=0
            until (echo > "/dev/tcp/$host/$port") 2>/dev/null; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 60 ]; then return 1; fi
              sleep 2
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry apt-get update
          retry apt-get install -y docker.io docker-compose-v2 git openssl
           systemctl enable --now docker
           rm -rf /opt/project/app
          retry git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
           cd /opt/project/app
          wait_for_port '${CloudInstance.PrivateIp}' 8000
          DIAGNOSIS_ENDPOINT='http://${CloudInstance.PrivateIp}:8000/diagnose' \
          docker compose -f deployments/hybrid/edge-compose.yml config -q
          docker compose -f deployments/hybrid/edge-compose.yml up -d --build edge-mqtt
          docker compose -f deployments/hybrid/edge-compose.yml build detector
          docker compose -f deployments/hybrid/edge-compose.yml up -d detector
          docker compose -f deployments/hybrid/edge-compose.yml build sensor-generator orchestrator
          DIAGNOSIS_ENDPOINT='http://${CloudInstance.PrivateIp}:8000/diagnose' \
            docker compose -f deployments/hybrid/edge-compose.yml up -d sensor-generator orchestrator

  CloudInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref CloudInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref CloudSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: thesis-hybrid-cloud
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/thesis-bootstrap.log) 2>&1
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 5 ]; then return 1; fi
              sleep 10
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry apt-get update
          retry apt-get install -y docker.io docker-compose-v2 git openssl
           systemctl enable --now docker
           rm -rf /opt/project/app
          retry git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
          cd /opt/project/app
          docker compose -f deployments/hybrid/cloud-compose.yml config -q
          docker compose -f deployments/hybrid/cloud-compose.yml up -d --build cloud-mqtt
          docker compose -f deployments/hybrid/cloud-compose.yml build classifier
          docker compose -f deployments/hybrid/cloud-compose.yml up -d classifier

Outputs:
  DashboardPublicIp:
    Value: !GetAtt DashboardInstance.PublicIp
  DashboardPrivateIp:
    Value: !GetAtt DashboardInstance.PrivateIp
  EdgePrivateIp:
    Value: !GetAtt EdgeInstance.PrivateIp
  CloudPrivateIp:
    Value: !GetAtt CloudInstance.PrivateIp
  DiagnosisEndpoint:
    Value: !Sub http://${CloudInstance.PrivateIp}:8000/diagnose
  EdgeMqttEndpoint:
    Value: !Sub ${EdgeInstance.PrivateIp}:1883
  CloudMqttEndpoint:
    Value: !Sub ${CloudInstance.PrivateIp}:1883
