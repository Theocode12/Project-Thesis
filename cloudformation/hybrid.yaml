AWSTemplateFormatVersion: '2010-09-09'
Description: Complete hybrid deployment with separate dashboard, edge, and cloud instances.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  DashboardInstanceType:
    Type: String
    Default: t3.small
  EdgeInstanceType:
    Type: String
    Default: t3.medium
  CloudInstanceType:
    Type: String
    Default: t3.large
  KeyName:
    Type: String
    Default: ''
  AdminCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Temporary SSH source range for testing.
  RepositoryUrl:
    Type: String
    Description: Git URL accessible by all instances.
  RepositoryRef:
    Type: String
    Default: main
  Domain:
    Type: String
    Default: hybrid-thesis.devval.dev
  CaddyCertificate:
    Type: String
    NoEcho: true
  CaddyPrivateKey:
    Type: String
    NoEcho: true

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: thesis-hybrid-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: thesis-hybrid-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: thesis-hybrid-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: thesis-hybrid-public-routes

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  DashboardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS dashboard and private MQTT client access.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-hybrid-dashboard-sg

  EdgeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private edge MQTT and orchestration services.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1883
          ToPort: 1883
          SourceSecurityGroupId: !Ref DashboardSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-hybrid-edge-sg

  CloudSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private cloud MQTT and classifier services.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1883
          ToPort: 1883
          SourceSecurityGroupId: !Ref DashboardSecurityGroup
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref EdgeSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: thesis-hybrid-cloud-sg

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  DashboardInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref DashboardInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref DashboardSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: thesis-hybrid-dashboard
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-plugin git
          systemctl enable --now docker
          rm -rf /opt/project/app
          git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
          cd /opt/project/app
          mkdir -p /opt/project/app/certs
          cat > /opt/project/app/certs/origin.pem <<'CERT'
          ${CaddyCertificate}
          CERT
          cat > /opt/project/app/certs/origin.key <<'KEY'
          ${CaddyPrivateKey}
          KEY
          chmod 600 /opt/project/app/certs/origin.key
          chmod 644 /opt/project/app/certs/origin.pem
          cat > /etc/thesis-dashboard.env <<'ENV'
          EDGE_MQTT_HOST=${EdgeInstance.PrivateIp}
          EDGE_MQTT_PORT=1883
          CLOUD_MQTT_HOST=${CloudInstance.PrivateIp}
          CLOUD_MQTT_PORT=1883
          DOMAIN=${Domain}
          ENV
          set -a
          source /etc/thesis-dashboard.env
          set +a
          docker compose -f deploments/hybrid/dashboard-compose.yml up -d --build

  EdgeInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref EdgeInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref EdgeSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: thesis-hybrid-edge
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-plugin git
          systemctl enable --now docker
          rm -rf /opt/project/app
          git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
          cd /opt/project/app
          DIAGNOSIS_ENDPOINT='http://${CloudInstance.PrivateIp}:8000/diagnose' \
            docker compose -f deploments/hybrid/edge-compose.yml up -d --build

  CloudInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref CloudInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref CloudSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: thesis-hybrid-cloud
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-plugin git
          systemctl enable --now docker
          rm -rf /opt/project/app
          git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/project/app
          cd /opt/project/app
          docker compose -f deploments/hybrid/cloud-compose.yml up -d --build

Outputs:
  DashboardPublicIp:
    Value: !GetAtt DashboardInstance.PublicIp
  DashboardPrivateIp:
    Value: !GetAtt DashboardInstance.PrivateIp
  EdgePrivateIp:
    Value: !GetAtt EdgeInstance.PrivateIp
  CloudPrivateIp:
    Value: !GetAtt CloudInstance.PrivateIp
  DiagnosisEndpoint:
    Value: !Sub http://${CloudInstance.PrivateIp}:8000/diagnose
  EdgeMqttEndpoint:
    Value: !Sub ${EdgeInstance.PrivateIp}:1883
  CloudMqttEndpoint:
    Value: !Sub ${CloudInstance.PrivateIp}:1883
