services:
  dashboard:
    build:
      context: ../..
      dockerfile: services/dashboard/Dockerfile
    container_name: hybrid-dashboard
    environment:
      MQTT_HOST: ${CLOUD_MQTT_HOST:-cloud-host}
      MQTT_PORT: ${CLOUD_MQTT_PORT:-1883}
      EDGE_MQTT_HOST: ${EDGE_MQTT_HOST:-edge-host}
      EDGE_MQTT_PORT: ${EDGE_MQTT_PORT:-1883}
      CLOUD_MQTT_HOST: ${CLOUD_MQTT_HOST:-cloud-host}
      CLOUD_MQTT_PORT: ${CLOUD_MQTT_PORT:-1883}
      DEPLOYMENT_MODE: hybrid
    expose:
      - "8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    container_name: hybrid-dashboard-proxy
    depends_on:
      dashboard:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../certs/origin.pem:/etc/caddy/certs/origin.pem:ro
      - ../../certs/origin.key:/etc/caddy/certs/origin.key:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-thesis.devval.dev}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
