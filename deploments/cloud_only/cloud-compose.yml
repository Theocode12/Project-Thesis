services:
  cloud-mqtt:
    build:
      context: ../../mqtt
    container_name: cloud-mqtt
    ports:
      - "${CLOUD_MQTT_BIND_ADDRESS:-0.0.0.0}:1883:1883"
    volumes:
      - cloud_mqtt_data:/mosquitto/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -r -m ok && mosquitto_sub -h 127.0.0.1 -p 1883 -t healthcheck -C 1 -W 2 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  detector:
    build:
      context: ../..
      dockerfile: services/detector/Dockerfile
    container_name: detector
    depends_on:
      - cloud-mqtt
    cpus: 4.0
    mem_limit: 4g
    environment:
      MQTT_HOST: cloud-mqtt
      MQTT_PORT: 1883
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3

  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    container_name: orchestrator
    depends_on:
      - cloud-mqtt
    cpus: 2.0
    mem_limit: 1g
    environment:
      MQTT_HOST: cloud-mqtt
      MQTT_PORT: 1883
      EVAL_WINDOW_SECONDS: ${EVAL_WINDOW_SECONDS:-10}
      ANOMALY_HIGH_RATIO: ${ANOMALY_HIGH_RATIO:-0.5}
      ANOMALY_LOW_RATIO: ${ANOMALY_LOW_RATIO:-0.1}
      FALLBACK_STREAM_INTERVAL: ${FALLBACK_STREAM_INTERVAL:-0.1}
      DIAGNOSIS_ENDPOINT: http://classifier:8000/diagnose
      DIAGNOSIS_TIMEOUT: ${DIAGNOSIS_TIMEOUT:-5.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3

  classifier:
    build:
      context: ../..
      dockerfile: services/classifier/Dockerfile
    container_name: classifier
    depends_on:
      - cloud-mqtt
    cpus: 2.0
    mem_limit: 4g
    environment:
      MQTT_HOST: cloud-mqtt
      MQTT_PORT: 1883
    ports:
      - "${DIAGNOSIS_BIND_ADDRESS:-0.0.0.0}:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cloud_mqtt_data:
