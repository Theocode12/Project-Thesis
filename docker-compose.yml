mqtt-broker:
  build:
    context: ./mqtt

  container_name: mqtt-broker

  ports:
    - "1883:1883"

  restart: unless-stopped

  sensor-generator:
    build:
      context: ./services/sensor-generator

    depends_on:
      - mqtt-broker

    volumes:
      - ./datasets:/datasets

    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883