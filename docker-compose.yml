services:

  mqtt-broker:
    build:
      context: ./mqtt

    container_name: mqtt-broker

    ports:
      - "1883:1883"

    restart: unless-stopped

  sensor-generator:
    build:
      context: .
      dockerfile: services/sensor-generator/Dockerfile

    depends_on:
      - mqtt-broker

    volumes:
      - ./datasets:/datasets

    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883